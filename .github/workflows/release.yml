name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    env:
      DEVELOPER_ID_APPLICATION: ${{ secrets.DEVELOPER_ID_APPLICATION }}
      DEVELOPER_ID_CERTIFICATE_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_BASE64 }}
      DEVELOPER_ID_CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
      NOTARY_API_KEY_BASE64: ${{ secrets.NOTARY_API_KEY_BASE64 }}
      NOTARY_KEY_ID: ${{ secrets.NOTARY_KEY_ID }}
      NOTARY_ISSUER: ${{ secrets.NOTARY_ISSUER }}
      SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
      SPARKLE_PRIVATE_KEY_BASE64: ${{ secrets.SPARKLE_PRIVATE_KEY_BASE64 }}
      SU_FEED_URL: ${{ vars.SU_FEED_URL }}
      GITHUB_TOKEN: ${{ github.token }}
      KEYCHAIN_PASSWORD: ${{ secrets.BUILD_KEYCHAIN_PASSWORD }}
      NOTARYTOOL_PROFILE: xcode-switcher-notary
      SPARKLE_DOWNLOAD_URL_PREFIX: https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release inputs
        run: |
          set -euo pipefail
          for name in DEVELOPER_ID_APPLICATION DEVELOPER_ID_CERTIFICATE_BASE64 DEVELOPER_ID_CERTIFICATE_PASSWORD NOTARY_API_KEY_BASE64 NOTARY_KEY_ID NOTARY_ISSUER SPARKLE_PUBLIC_KEY SPARKLE_PRIVATE_KEY_BASE64 SU_FEED_URL KEYCHAIN_PASSWORD; do
            if [[ -z "${!name:-}" ]]; then
              echo "Missing Actions secret or variable: $name" >&2
              exit 1
            fi
          done

      - name: Import Developer ID certificate
        run: |
          set -euo pipefail
          keychain_path="$RUNNER_TEMP/xcode-switcher-build.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id.p12"
          printf '%s' "$DEVELOPER_ID_CERTIFICATE_BASE64" | base64 --decode > "$certificate_path"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -k "$keychain_path" -P "$DEVELOPER_ID_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$keychain_path"
          security list-keychains -d user -s "$keychain_path"
          security default-keychain -s "$keychain_path"

      - name: Configure notarization credentials
        run: |
          set -euo pipefail
          key_path="$RUNNER_TEMP/AuthKey_${NOTARY_KEY_ID}.p8"
          printf '%s' "$NOTARY_API_KEY_BASE64" | base64 --decode > "$key_path"
          xcrun notarytool store-credentials "$NOTARYTOOL_PROFILE" --key "$key_path" --key-id "$NOTARY_KEY_ID" --issuer "$NOTARY_ISSUER" --keychain "$RUNNER_TEMP/xcode-switcher-build.keychain-db"

      - name: Prepare Sparkle signing key
        run: |
          set -euo pipefail
          sparkle_key_path="$RUNNER_TEMP/sparkle-private-key"
          printf '%s' "$SPARKLE_PRIVATE_KEY_BASE64" | base64 --decode > "$sparkle_key_path"
          echo "SPARKLE_PRIVATE_KEY_FILE=$sparkle_key_path" >> "$GITHUB_ENV"

      - name: Build, notarize and generate appcast
        run: ./build_release.sh

      - name: Publish GitHub Release
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "build/Xcode Switcher.app/Contents/Info.plist")
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "build/Xcode Switcher.app/Contents/Info.plist")
          gh release create "$GITHUB_REF_NAME" \
            "release/Xcode-Switcher-$version-$build_number.dmg" \
            "release/updates/Xcode-Switcher-$version-$build_number.zip" \
            "release/appcast.xml" \
            --title "Xcode Switcher $GITHUB_REF_NAME" \
            --generate-notes
