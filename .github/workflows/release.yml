name: Release (direct distribution)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate release tag
        run: |
          set -euo pipefail
          version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Info.plist version $version" >&2
            exit 1
          fi
          echo "RELEASE_VERSION=$version" >> "$GITHUB_ENV"
          echo "RELEASE_BUILD=$build_number" >> "$GITHUB_ENV"

      - name: Build direct-distribution candidate
        run: ./build_local_release.sh

      - name: Generate checksums
        run: |
          set -euo pipefail
          shasum -a 256 \
            "release/local/Xcode-Switcher-$RELEASE_VERSION-$RELEASE_BUILD-local.zip" \
            "release/local/Xcode-Switcher-$RELEASE_VERSION-$RELEASE_BUILD-local.dmg" \
            > "release/local/SHA256SUMS"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/local/Xcode-Switcher-$RELEASE_VERSION-$RELEASE_BUILD-local.zip" \
            "release/local/Xcode-Switcher-$RELEASE_VERSION-$RELEASE_BUILD-local.dmg" \
            "release/local/SHA256SUMS" \
            --title "Xcode Switcher $GITHUB_REF_NAME" \
            --generate-notes
